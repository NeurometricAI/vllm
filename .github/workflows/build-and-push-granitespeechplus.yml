name: Build and push vllm-openai (granite-speech-plus)

on:
  push:
    branches: [granite-speech-plus]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/Dockerfile.granitespeechplus
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/neurometricai/vllm-openai:v0.20.2-granitespeechplus
            ghcr.io/neurometricai/vllm-openai:sha-${{ github.sha }}
